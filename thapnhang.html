<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thắp Nhang Online</title>
    <style>
        /* --- CẤU HÌNH CHUNG --- */
        body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 60%, #2a1a10 0%, #000000 80%);
            overflow: hidden; position: relative;
            font-family: 'Times New Roman', serif;
            user-select: none; touch-action: none;
        }

        /* HƯỚNG DẪN */
        #guide-text {
            position: absolute; top: 5vh; width: 100%;
            text-align: center; color: #ffd700;
            font-size: max(24px, 4vw); font-weight: bold;
            text-shadow: 0 4px 10px #000;
            z-index: 200; pointer-events: none;
            transition: opacity 0.5s;
            animation: floatText 3s infinite ease-in-out;
        }

        /* LỜI KHẤN */
        #prayer-text {
            position: absolute; top: 10vh; width: 100%;
            text-align: center; color: #ffeb3b;
            font-size: max(30px, 5vw); font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 10px #ff9800, 0 0 20px #ff5722;
            opacity: 0; transform: translateY(20px);
            transition: all 1s ease-out;
            z-index: 150; pointer-events: none;
        }
        #prayer-text.show { opacity: 1; transform: translateY(0); }

        /* BÀN THỜ */
        #table {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 25vh;
            background: linear-gradient(to bottom, #4e342e, #281814);
            border-top: 1.5vh solid #6d4c41;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.7); z-index: 1;
        }

        /* KHUNG ẢNH */
        .frames-area {
            position: absolute; bottom: 50vh; 
            left: 5%; width: 90%;
            display: flex; justify-content: space-around; align-items: flex-end; z-index: 0;
        }
        .frame {
            width: 18vmin; height: 24vmin;
            background: #111; border: 0.5vmin solid #ffd700;
            border-radius: 4px; box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
            position: relative; overflow: hidden;
        }
        .frame img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
        .frame::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
        }

        /* --- VẬT PHẨM --- */

        /* 1. HŨ NẾN */
        #candle-zone {
            position: absolute; bottom: 20vh; right: 10vw;
            width: 8vmin; height: 14vmin; z-index: 50;
        }
        .candle-body {
            width: 100%; height: 100%;
            background: linear-gradient(to right, #b71c1c, #d32f2f, #b71c1c);
            border-radius: 4px; box-shadow: 0 0 20px rgba(255,0,0,0.2);
        }
        .candle-flame {
            position: absolute; top: -30%; left: 50%; transform: translateX(-50%);
            width: 30%; height: 40%;
            background: #ff9800; border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 20px #ff5722, 0 0 40px #ff9800;
            animation: flicker 0.1s infinite alternate;
        }

        /* 2. LƯ HƯƠNG PHẲNG */
        #burner-zone {
            position: absolute; bottom: 18vh; left: 50%; transform: translateX(-50%);
            width: 28vmin; height: 18vmin; z-index: 40; 
            display: flex; justify-content: center; align-items: flex-end;
        }
        
        .burner-flat-front {
            position: relative; width: 100%; height: 80%;
            background: linear-gradient(to bottom, #c49a6c, #8B4513);
            border-radius: 5px 5px 30% 30%; border: 2px solid #5d3a27;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 40;
        }
        .burner-flat-front::after {
            content: '佛'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 5vmin; color: #3e2723; font-weight: bold; opacity: 0.7;
        }

        .deco-sticks { position: absolute; bottom: 75%; left: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none;}
        .ds { position: absolute; bottom: 0; width: 0.5vmin; background: #795548; border-radius: 2px; }
        
        .ds-left-1 { left: 20%; height: 10vmin; transform: rotate(-12deg); }
        .ds-left-2 { left: 30%; height: 13vmin; transform: rotate(-8deg); background: #555; }
        .ds-left-3 { left: 38%; height: 9vmin; transform: rotate(-5deg); }
        
        .ds-right-1 { left: 62%; height: 11vmin; transform: rotate(5deg); }
        .ds-right-2 { left: 70%; height: 14vmin; transform: rotate(8deg); background: #555; }
        .ds-right-3 { left: 80%; height: 9vmin; transform: rotate(12deg); }
        
        .ds-smoke { position: absolute; top: -20%; left: 70%; width: 1vmin; height: 5vmin; background:rgba(255,255,255,0.1); filter:blur(3px); animation: smokeRise 4s infinite; }


        /* 3. CÂY NHANG CHÍNH */
        #incense {
            position: absolute; bottom: 15vh; left: 10vw;
            width: 10vmin; height: 35vmin;
            z-index: 100; cursor: grab; display: flex; justify-content: center; align-items: flex-end;
            transition: transform 0.05s linear;
        }
        
        .stick-group { position: relative; width: 1vmin; height: 100%; }
        .stick-leg { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; background: #d50000; }
        .stick-body { position: absolute; bottom: 40%; left: 0; width: 100%; height: 60%; background: #795548; border-radius: 3px 3px 0 0;}

        #fire-tip {
            position: absolute; top: 0; left: -25%; width: 150%; height: 1.5vmin;
            background: #ff3d00; border-radius: 50%;
            box-shadow: 0 0 15px red, 0 0 10px yellow;
            opacity: 0; transition: opacity 0.3s;
        }
        #smoke {
            position: absolute; top: -25%; left: 50%; transform: translateX(-50%);
            width: 2vmin; height: 10vmin;
            background: rgba(255,255,255,0.4); filter: blur(6px); border-radius: 50%;
            opacity: 0; animation: smokeRise 2s infinite linear;
        }

        #incense.placed { z-index: 35 !important; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* NÚT RESET */
        #reset-btn {
            position: absolute; bottom: 8vh; left: 50%; transform: translateX(-50%);
            padding: 1.5vh 4vw; font-size: max(16px, 2.5vmin); font-weight: bold; color: #3e2723;
            background: linear-gradient(to bottom, #ffeb3b, #fbc02d);
            border: 3px solid #fff; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 25px #ffd700; text-transform: uppercase;
            display: none; z-index: 200; animation: popUp 0.5s forwards;
        }

        /* ANIMATIONS */
        @keyframes floatText { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes flicker { 0% { opacity: 0.9; transform: translateX(-50%) scale(1); } 100% { opacity: 1; transform: translateX(-50%) scale(1.1); } }
        @keyframes smokeRise { 0% { transform: translateX(-50%) translateY(0); opacity: 0.6; } 100% { transform: translateX(-50%) translateY(-80px) scale(2); opacity: 0; } }
        @keyframes popUp { from { opacity: 0; transform: translateX(-50%) scale(0.5); } to { opacity: 1; transform: translateX(-50%) scale(1); } }

    </style>
</head>
<body>

    <audio id="bg-music" src="sounds/bgmusic.mp3" loop></audio>
    <audio id="bong-sound" src="sounds/bong.mp3"></audio>

    <div id="guide-text">Bấm vào màn hình để hành lễ</div>
    
    <div id="prayer-text">NAM MÔ VIVJ ĐÀ LẠT</div>

    <button id="reset-btn" onclick="resetGame()">Thắp lại</button>

    <div class="frames-area">
        <div class="frame"><img src="images/nanami.jpg""></div>
        <div class="frame"><img src="images/thanos.webp" alt=""></div>
        <div class="frame"><img src="images/eren.jpg" alt=""></div>
    </div>

    <div id="table"></div>

    <div id="burner-zone">
        <div class="burner-flat-front"></div>
        <div class="deco-sticks">
            <div class="ds ds-left-1"></div>
            <div class="ds ds-left-2"></div>
            <div class="ds ds-left-3"></div>
            <div class="ds ds-right-1"></div>
            <div class="ds ds-right-2"><div class="ds-smoke"></div></div>
            <div class="ds ds-right-3"></div>
        </div>
    </div>

    <div id="candle-zone">
        <div class="candle-flame"></div>
        <div class="candle-body"></div>
    </div>

    <div id="incense">
        <div class="stick-group">
            <div id="smoke"></div>
            <div class="stick-body">
                <div id="fire-tip"></div>
            </div>
            <div class="stick-leg"></div>
        </div>
    </div>

    <script>
        let isZoomed = false;
        let isLit = false;
        let isPlaced = false;

        const body = document.body;
        const guide = document.getElementById('guide-text');
        const prayer = document.getElementById('prayer-text');
        const incense = document.getElementById('incense');
        const fireTip = document.getElementById('fire-tip');
        const smoke = document.getElementById('smoke');
        const resetBtn = document.getElementById('reset-btn');
        const candleZone = document.getElementById('candle-zone');
        const burnerZone = document.getElementById('burner-zone');

        // KHAI BÁO ÂM THANH
        const bgMusic = document.getElementById('bg-music');
        const bongSound = document.getElementById('bong-sound');

        // Bắt đầu
        body.addEventListener('click', function(e) {
            if (!isZoomed && e.target.id !== 'reset-btn') {
                isZoomed = true;
                body.style.transition = "transform 1s ease";
                body.style.transform = "scale(1.1)";
                guide.innerText = "Kéo nhang vào ngọn nến để châm lửa";
                
                // PHÁT NHẠC NỀN
                bgMusic.volume = 0.5; // Âm lượng 50%
                bgMusic.play().catch(error => console.log("Chưa tương tác, chưa phát nhạc được"));

                initDrag();
            }
        });

        // DRAG & DROP
        let startX, startY, initialX, initialY, currentX, currentY;
        function initDrag() {
            incense.addEventListener('mousedown', dragStart);
            incense.addEventListener('touchstart', dragStart, {passive: false});
        }
        function dragStart(e) {
            if (isPlaced || !isZoomed) return;
            if (e.type === 'touchstart') { startX = e.touches[0].clientX; startY = e.touches[0].clientY; } 
            else { startX = e.clientX; startY = e.clientY; }
            const style = window.getComputedStyle(incense);
            const matrix = new WebKitCSSMatrix(style.transform);
            initialX = matrix.m41; initialY = matrix.m42;
            document.addEventListener('mousemove', dragMove); document.addEventListener('touchmove', dragMove, {passive: false});
            document.addEventListener('mouseup', dragEnd); document.addEventListener('touchend', dragEnd);
            incense.style.cursor = 'grabbing'; incense.style.transition = 'none';
        }
        function dragMove(e) {
            e.preventDefault();
            let clientX, clientY;
            if (e.type === 'touchmove') { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } 
            else { clientX = e.clientX; clientY = e.clientY; }
            const dx = clientX - startX; const dy = clientY - startY;
            currentX = initialX + dx; currentY = initialY + dy;
            incense.style.transform = `translate(${currentX}px, ${currentY}px)`;
            checkCollision();
        }
        function dragEnd() {
            document.removeEventListener('mousemove', dragMove); document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('mouseup', dragEnd); document.removeEventListener('touchend', dragEnd);
            incense.style.cursor = 'grab';
        }

        // CHECK COLLISION
        function checkCollision() {
            const incenseRect = incense.getBoundingClientRect();
            const candleRect = candleZone.getBoundingClientRect();
            const burnerRect = burnerZone.getBoundingClientRect();
            const tipX = incenseRect.left + incenseRect.width / 2; const tipY = incenseRect.top; 

            if (!isLit) {
                if (tipX >= candleRect.left - 30 && tipX <= candleRect.right + 30 &&
                    tipY >= candleRect.top - 30 && tipY <= candleRect.bottom + 30) {
                    isLit = true; fireTip.style.opacity = 1; smoke.style.opacity = 1;
                    guide.innerText = "Đã cháy! Cắm vào giữa lư hương."; guide.style.color = "#ff4500";
                }
            }
            if (isLit && !isPlaced) {
                const baseX = incenseRect.left + incenseRect.width / 2; const baseY = incenseRect.bottom;
                if (baseX >= burnerRect.left && baseX <= burnerRect.right &&
                    baseY >= burnerRect.top && baseY <= burnerRect.bottom) {
                    placeIncense();
                }
            }
        }

        // CẮM NHANG
        function placeIncense() {
            isPlaced = true;
            document.removeEventListener('mousemove', dragMove); document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('mouseup', dragEnd); document.removeEventListener('touchend', dragEnd);
            
            incense.style.transform = "none"; 
            incense.classList.add('placed'); 
            
            incense.style.left = "calc(50% - 5vmin)"; 
            incense.style.bottom = "22vh"; 
            
            guide.style.opacity = 0; 
            
            // PHÁT TIẾNG MÕ
            bongSound.currentTime = 0;
            bongSound.play();

            setTimeout(() => { prayer.classList.add('show'); }, 600);
            setTimeout(() => { resetBtn.style.display = "block"; }, 1500);
        }

        // RESET
        function resetGame() {
            isZoomed = false; isLit = false; isPlaced = false; currentX = 0; currentY = 0;
            resetBtn.style.display = 'none';
            body.style.transform = "scale(1)";
            
            incense.style.transition = "all 1s ease";
            incense.classList.remove('placed'); 
            fireTip.style.opacity = 0; smoke.style.opacity = 0;
            incense.style.transform = "none"; 
            incense.style.left = "10vw"; incense.style.bottom = "15vh";
            
            guide.style.opacity = 1; guide.innerText = "Bấm vào màn hình để hành lễ"; guide.style.color = "#ffd700";
            
            prayer.classList.remove('show');
        }
    </script>
</body>
</html>
